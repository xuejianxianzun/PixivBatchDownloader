<circle cx="432.7" cy="66.7" r="3" fill="#185FA5"/>
<circle cx="484.5" cy="60.4" r="3" fill="#185FA5"/>
<circle cx="536.4" cy="54.1" r="3" fill="#185FA5"/>
<circle cx="588.2" cy="47.8" r="3" fill="#185FA5"/>
<circle cx="640" cy="41.5" r="3" fill="#185FA5"/>
<text x="127.8" y="71.5" font-size="11" fill="#5F5E5A">被压制掉的部分（减半 → 0）</text>
<text x="70" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">2</text>
<text x="121.8" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">4</text>
<text x="173.6" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">6</text>
<text x="225.5" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">8</text>
<text x="277.3" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">10</text>
<text x="329.1" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">12</text>
<text x="380.9" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">14</text>
<text x="432.7" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">16</text>
<text x="484.5" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">18</text>
<text x="536.4" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">20</text>
<text x="588.2" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">22</text>
<text x="640" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">24</text>
<text x="70" y="232" font-size="13" font-weight="500" fill="#2C2C2A">系数 K = 倍率 / 时长（收藏数 × K = 日均收藏数量）</text>
<text x="640" y="232" font-size="11" fill="#5F5E5A" text-anchor="end">不足 2 小时按 2 小时算</text>
<line x1="70" y1="374" x2="640" y2="374" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="378" font-size="11" fill="#5F5E5A" text-anchor="end">0</text>
<line x1="70" y1="342.8" x2="640" y2="342.8" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="346.8" font-size="11" fill="#5F5E5A" text-anchor="end">3</text>
<line x1="70" y1="311.6" x2="640" y2="311.6" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="315.6" font-size="11" fill="#5F5E5A" text-anchor="end">6</text>
<line x1="70" y1="280.4" x2="640" y2="280.4" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="284.4" font-size="11" fill="#5F5E5A" text-anchor="end">9</text>
<line x1="70" y1="249.2" x2="640" y2="249.2" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="253.2" font-size="11" fill="#5F5E5A" text-anchor="end">12</text>
