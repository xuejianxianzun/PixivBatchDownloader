<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">
<title>日均收藏数量的压制曲线：12 个刻度上的倍率与系数</title>
<desc>横轴为作品发布时长（2 到 24 小时）。上图是倍率：2 小时时为 12，之后线性增加到 24 小时时的正常值 24。下图是据此算出的系数（收藏数量乘以它得到日均收藏数量），从 6 降到 1，并与不压制时的系数对比。</desc>
<text x="70" y="18" font-size="13" font-weight="500" fill="#2C2C2A">倍率 R：2 小时为 12，到 24 小时线性增加到正常的 24</text>
<text x="640" y="18" font-size="11" fill="#5F5E5A" text-anchor="end">R = 12 + 12 × (时长 - 2) / 22</text>
<line x1="70" y1="180" x2="640" y2="180" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="184" font-size="11" fill="#5F5E5A" text-anchor="end">0</text>
<line x1="70" y1="145.4" x2="640" y2="145.4" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="149.4" font-size="11" fill="#5F5E5A" text-anchor="end">6</text>
<line x1="70" y1="110.8" x2="640" y2="110.8" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="114.8" font-size="11" fill="#5F5E5A" text-anchor="end">12</text>
<line x1="70" y1="76.2" x2="640" y2="76.2" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="80.2" font-size="11" fill="#5F5E5A" text-anchor="end">18</text>
<line x1="70" y1="41.5" x2="640" y2="41.5" stroke="#2C2C2A" stroke-opacity="0.12" stroke-width="1"/>
<text x="56" y="45.5" font-size="11" fill="#5F5E5A" text-anchor="end">24</text>
<path d="M70,110.8 L121.8,104.5 L173.6,98.2 L225.5,91.9 L277.3,85.6 L329.1,79.3 L380.9,73 L432.7,66.7 L484.5,60.4 L536.4,54.1 L588.2,47.8 L640,41.5 L640,41.5 L70,41.5 Z" fill="#E6F1FB" stroke="none"/>
<path d="M70,110.8 L121.8,104.5 L173.6,98.2 L225.5,91.9 L277.3,85.6 L329.1,79.3 L380.9,73 L432.7,66.7 L484.5,60.4 L536.4,54.1 L588.2,47.8 L640,41.5" fill="none" stroke="#185FA5" stroke-width="2"/>
<line x1="70" y1="41.5" x2="640" y2="41.5" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text x="640" y="35.5" font-size="11" fill="#5F5E5A" text-anchor="end">不压制时的倍率</text>
<text x="79" y="114.8" font-size="11" fill="#185FA5">12.00</text>
<text x="636" y="55.5" font-size="11" fill="#185FA5" text-anchor="end">24.00</text>
<circle cx="70" cy="110.8" r="3" fill="#185FA5"/>
<circle cx="121.8" cy="104.5" r="3" fill="#185FA5"/>
<circle cx="173.6" cy="98.2" r="3" fill="#185FA5"/>
<circle cx="225.5" cy="91.9" r="3" fill="#185FA5"/>
