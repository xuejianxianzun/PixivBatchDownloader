<path d="M70,311.6 L121.8,340 L173.6,349.4 L225.5,354.1 L277.3,357 L329.1,358.9 L380.9,360.2 L432.7,361.2 L484.5,362 L536.4,362.7 L588.2,363.2 L640,363.6" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="173.6" y="330.3" font-size="11" fill="#5F5E5A">不压制时：24 / 时长</text>
<text x="79" y="307.6" font-size="11" fill="#0F6E56">6.00</text>
<text x="636" y="355.6" font-size="11" fill="#0F6E56" text-anchor="end">1.00</text>
<circle cx="70" cy="311.6" r="3" fill="#0F6E56"/>
<circle cx="121.8" cy="340" r="3" fill="#0F6E56"/>
<circle cx="173.6" cy="349.4" r="3" fill="#0F6E56"/>
<circle cx="225.5" cy="354.1" r="3" fill="#0F6E56"/>
<circle cx="277.3" cy="357" r="3" fill="#0F6E56"/>
<circle cx="329.1" cy="358.9" r="3" fill="#0F6E56"/>
<circle cx="380.9" cy="360.2" r="3" fill="#0F6E56"/>
<circle cx="432.7" cy="361.2" r="3" fill="#0F6E56"/>
<circle cx="484.5" cy="362" r="3" fill="#0F6E56"/>
<circle cx="536.4" cy="362.7" r="3" fill="#0F6E56"/>
<circle cx="588.2" cy="363.2" r="3" fill="#0F6E56"/>
<circle cx="640" cy="363.6" r="3" fill="#0F6E56"/>
<text x="440" y="341.6" font-size="11" fill="#5F5E5A">压制后（更靠下 = 更难通过）</text>
<text x="70" y="390" font-size="11" fill="#5F5E5A" text-anchor="middle">2</text>
<text x="121.8" y="390" font-size="11" fill="#5F5E5A" text-anchor="middle">4</text>
<text x="173.6" y="390" font-size="11" fill="#5F5E5A" text-anchor="middle">6</text>
